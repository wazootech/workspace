name: Runtime sweep (throwaway)

# One-time baseline for wazootech/workspace#50. Not meant to be merged: each
# repository should own its own compatibility checks.
on:
  pull_request:
    paths: [sweep/**, .github/workflows/runtime-sweep.yml]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: echo "repos=$(jq -c '[.source[].repo]' sweep/targets.json)" >> "$GITHUB_OUTPUT"

  source:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.plan.outputs.repos) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: target
        run: |
          jq -r --arg r '${{ matrix.repo }}' '.source[] | select(.repo == $r) |
            "ref=\(.ref // "main")\ndir=\(.dir // ".")"' sweep/targets.json >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wazootech/${{ matrix.repo }}
          ref: ${{ steps.target.outputs.ref }}
          path: target
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.x"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8
      - name: Install dependencies as the repository does
        working-directory: target/${{ steps.target.outputs.dir }}
        run: bun install --frozen-lockfile --ignore-scripts
      - run: bun sweep/source.ts '${{ matrix.repo }}' target 'source-${{ matrix.repo }}.json'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-${{ matrix.repo }}
          path: source-${{ matrix.repo }}.json

  published:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        runtime: [bun, node22, node24, deno]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.x"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.runtime == 'node22' && '22.23.5' || '24.22.3' }}
          package-manager-cache: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8
      - run: bun sweep/published.ts ${{ matrix.runtime }} published-${{ matrix.runtime }}-${{ matrix.os }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-${{ matrix.runtime }}-${{ matrix.os }}
          path: published-${{ matrix.runtime }}-${{ matrix.os }}.json
